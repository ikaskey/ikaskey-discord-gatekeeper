packages:
  - "packages/*"

# pnpm 11+ は .npmrc から認証・レジストリ以外の設定を読まない。設定はここに camelCase で置く
# `pnpm deploy`(Docker本番ビルド) を injected モードで動かすために必須
injectWorkspacePackages: true

catalog:
  # TS7(ネイティブ版)への橋渡しメジャー。TS7 RCはtsup等がtypescriptのJS API(exports)非対応で不可→GA前後で移行
  typescript: ^6.0.0
  # lint / fmt / test は Vite+ に集約（vp test は内蔵の vitest 5 を使う。standalone vitest は入れない）
  vite-plus: 1.4.0

# postinstall ビルドを許可する依存（pnpm 12 は許可のない postinstall があると install を止める）
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  esbuild: true

# vite-plus 1.x は vite の代わりに @voidzero-dev/vite-plus-core（版は 1.x）を vitest に渡す。
# vitest 5 の peer（vite ^6 || ^7 || ^8）に版番号が合わないだけなので、vite-plus 配下の vitest に限って許す
peerDependencyRules:
  allowedVersions:
    "vitest>vite": "*"
    "@vitest/mocker>vite": "*"
