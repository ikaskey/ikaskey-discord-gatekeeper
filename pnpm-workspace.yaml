packages:
  - "packages/*"

# pnpm 11+ は .npmrc から認証・レジストリ以外の設定を読まない。設定はここに camelCase で置く
# `pnpm deploy`(Docker本番ビルド) を injected モードで動かすために必須
injectWorkspacePackages: true

catalog:
  # TS7(ネイティブ版)への橋渡しメジャー。TS7 RCはtsup等がtypescriptのJS API(exports)非対応で不可→GA前後で移行
  typescript: ^6.0.0
  # テストは Vite+(vp test=内蔵vitest4)へ集約したため、standalone vitest は廃止

# postinstall ビルドを許可する依存（pnpm 12 は許可のない postinstall があると install を止める）
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  esbuild: true
